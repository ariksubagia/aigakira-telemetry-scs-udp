[package]
name = "overlay-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Test host for the in-game overlay: loads the real plugin like the game does, renders frames and checks the pixels"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
scs-sdk-sys = "=0.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gl = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
