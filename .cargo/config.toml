# Cross-compilation from Linux to the Windows x64 DLL that ETS2 (under Proton)
# loads from bin/win_x64/plugins/.
#
#   rustup target add x86_64-pc-windows-gnu
#   sudo pacman -S mingw-w64-gcc        # or: apt install gcc-mingw-w64-x86-64
#   cargo build --release --target x86_64-pc-windows-gnu

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
# Link the MinGW runtime pieces (winpthread, libgcc) statically so the DLL does
# not depend on libgcc_s_seh-1.dll / libwinpthread-1.dll being present in the
# game directory.
rustflags = ["-C", "target-feature=+crt-static"]
